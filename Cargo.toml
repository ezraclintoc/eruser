[package]
name = "eruser"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
async-trait = "0.1.92"
axum = "0.8.9"
chromiumoxide = "0.9.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
dialoguer = { version = "0.12.0", default-features = false, features = ["password"] }
futures = "0.3.34"
lettre = { version = "0.11.23", default-features = false, features = ["tokio1-rustls", "smtp-transport", "builder", "rustls-native-certs", "pool", "ring"] }
mail-parser = "0.11.6"
mime_guess = "2.0.5"
minijinja = { version = "2.24.0", features = ["loader"] }
rand = "0.10.2"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "charset", "http2", "gzip"] }
rust-embed = { version = "8.12.0", features = ["interpolate-folder-path"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "logging", "tls12", "std"] }
rustls-native-certs = "0.8.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_norway = "0.9.42"
serde_urlencoded = "0.7.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "chrono", "macros", "migrate"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-util = "0.7.19"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["fs", "compression-gzip", "set-header", "trace", "limit", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.24.1", features = ["v4"] }
webpki-roots = "1.0.9"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
