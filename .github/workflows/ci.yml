name: CI

# Runs on pushes to main and on pull requests. Nightly builds are
# deliberately absent until the port is finished — there is no point burning
# runner minutes compiling a tree that changes a dozen times a day.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push to the same branch supersedes the run already in flight.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      - name: Build release
        run: cargo build --release

  # The broker database is the product. A malformed entry is worse than a
  # failing build, because it ships a request that goes nowhere.
  brokers:
    name: Broker database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate data/brokers.yaml
        run: cargo test --lib broker::tests::bundled_broker_database_loads_and_is_well_formed

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
