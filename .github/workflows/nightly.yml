name: Nightly

# Held back until the port was finished, so it would not spend runner
# minutes compiling a tree that changed a dozen times a day.
#
# What this catches that CI does not: a dependency that has published a
# breaking change, a new Rust release that warns about something, and a
# broker address that has quietly stopped existing.
on:
  schedule:
    # 04:20 UTC, well clear of the hour when everyone else's cron fires.
    - cron: "20 4 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The pinned toolchain against the newest dependencies that semver allows.
  # This is what breaks first when a dependency ships a bad minor release.
  latest-dependencies:
    name: Latest dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Update every dependency
        run: cargo update --verbose
      - run: cargo test --all-features
      - name: Report
        if: failure()
        run: |
          echo "::warning::A dependency update broke the build."
          echo "Run 'cargo update' locally to reproduce."

  # A newer compiler warns about things the pinned one does not. Failing here
  # is a heads-up, not a broken build, so it does not gate anything.
  beta-toolchain:
    name: Beta toolchain
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@beta
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  # The three platforms the release workflow builds for.
  platforms:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  # A vulnerability disclosed today affects a dependency that was fine
  # yesterday, so this is worth re-running even when nothing has changed.
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Brokers go out of business, get bought, and change their privacy address.
  # An entry pointing at a domain that no longer resolves is a request that
  # will never arrive, and there is no way to notice that from a send report.
  broker-database:
    name: Broker database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Validate the database
        run: "cargo test --lib broker::"

      - name: Check contact domains still resolve
        run: |
          # Every distinct domain behind a broker's contact address.
          grep -oP '^\s+email:\s*\K\S+' data/brokers.yaml \
            | grep -oP '@\K.*' \
            | tr '[:upper:]' '[:lower:]' \
            | sort -u > domains.txt

          echo "Checking $(wc -l < domains.txt) domains."
          : > dead.txt

          while read -r domain; do
            # MX first, since that is what actually has to exist for mail to
            # arrive; fall back to A, because plenty of small brokers accept
            # mail on the bare domain.
            if ! host -t MX "$domain" >/dev/null 2>&1 \
               && ! host -t A "$domain" >/dev/null 2>&1; then
              echo "$domain" >> dead.txt
            fi
          done < domains.txt

          count=$(wc -l < dead.txt)
          echo "$count domains did not resolve."

          if [ "$count" -gt 0 ]; then
            echo "### Broker domains that did not resolve" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat dead.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "A domain can fail to resolve for a moment, so check one by hand" >> "$GITHUB_STEP_SUMMARY"
            echo "before removing its entry." >> "$GITHUB_STEP_SUMMARY"
          fi

          # DNS is flaky and brokers come and go; a handful failing is normal
          # and should not turn the nightly red. A large number means
          # something is wrong with the check itself.
          if [ "$count" -gt 50 ]; then
            echo "::error::$count domains failed — that is too many to be real."
            exit 1
          fi
