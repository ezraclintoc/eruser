# Eraser Configuration Example
# Copy this file to ~/.eraser/config.yaml and fill in your details

profile:
  # Required: Your personal information for removal requests
  first_name: John
  last_name: Doe
  email: john.doe@example.com

  # Optional: Additional info helps brokers locate your records
  address: "123 Main Street"
  city: "San Francisco"
  state: "CA"
  zip_code: "94102"
  country: "USA"
  phone: "+1-555-123-4567"
  date_of_birth: "1990-01-15"  # Format: YYYY-MM-DD

email:
  # How to send: "smtp", "resend", or "sendgrid".
  #
  # smtp     — your own mailbox. Free, and requests come from your real
  #            address. Gmail needs 2FA on and an app password.
  # resend   — one API key, nothing else. Free tier covers a full run.
  # sendgrid — same idea.
  #
  # Both services need you to verify the address you send from first.
  provider: smtp
  from: john.doe@example.com

  # SMTP configuration (for Gmail, Outlook, etc.)
  smtp:
    host: smtp.gmail.com
    port: 465
    username: john.doe@gmail.com
    password: your-app-password  # Use app password, not your regular password!
    use_tls: true

  # Sending services, as alternatives to SMTP. Set provider above to match.
  # resend:
  #   api_key: re_xxxxxxxxxxxxxxxxxxxx
  # sendgrid:
  #   api_key: SG.xxxxxxxxxxxxxxxxxxxx

options:
  # Template to use: "gdpr", "ccpa", or "generic"
  template: generic

  # Delay between emails in milliseconds (avoid spam filters)
  rate_limit_ms: 2000

  # Only send to brokers in these regions (optional)
  # regions:
  #   - us
  #   - global

  # Skip these brokers (optional)
  # excluded_brokers:
  #   - spokeo
  #   - whitepages

pipeline:
  # Automation the tool may do on its own. Both default to off.
  # auto_confirm: false      # click confirmation links found in replies
  # auto_fill_forms: false   # drive a browser through opt-out forms
  # browser_headless: true
  # browser_timeout_sec: 30

  # Optional: a captcha solver you run yourself, tried before a challenge
  # is left for you to do by hand. eruser ships no solving models — you
  # point this at your own sidecar service, which answers
  #   POST {"kind": "hcaptcha", "page_url": "https://..."}
  #   -> 200 {"status": "solved"}   or {"status": "failed", "detail": "..."}
  # A solver that is unreachable, or claims success without the challenge
  # actually leaving the page, changes nothing: the form is left for you
  # exactly as it would be with no solver at all.
  captcha_solver:
    enabled: false
    # url: http://localhost:9100/solve
    # token: shared-secret    # optional, sent as a bearer token
    # timeout_sec: 30

  # Optional: a drafting model you run yourself, writing replies to the
  # brokers that ask for one. Speaks the OpenAI-compatible chat API, so
  # Ollama, llama.cpp server, LM Studio, and vLLM all work as endpoints.
  # Every draft lands on the task list for you to read and send — nothing
  # is sent by itself unless its reply type is listed under auto_send.
  # Identity-verification requests are never auto-sent, whatever the list
  # says.
  ai:
    enabled: false
    # endpoint: http://localhost:11434/v1   # Ollama
    # model: qwen3:4b
    # api_key: ""                           # only if your sidecar wants one
    # timeout_sec: 60
    # max_drafts_per_run: 50
    # Reply types that may go out without a person pressing send.
    # Options: confirm, missing_info. Empty (the default) means every
    # draft waits for you.
    # auto_send: []
