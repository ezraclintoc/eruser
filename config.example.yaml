# Eraser Configuration Example
# Copy this file to ~/.eraser/config.yaml and fill in your details

profile:
  # Required: Your personal information for removal requests
  first_name: John
  last_name: Doe
  email: john.doe@example.com

  # Optional: Additional info helps brokers locate your records
  address: "123 Main Street"
  city: "San Francisco"
  state: "CA"
  zip_code: "94102"
  country: "USA"
  phone: "+1-555-123-4567"
  date_of_birth: "1990-01-15"  # Format: YYYY-MM-DD

email:
  # How to send: "smtp", "resend", or "sendgrid".
  #
  # smtp     — your own mailbox. Free, and requests come from your real
  #            address. Gmail needs 2FA on and an app password.
  # resend   — one API key, nothing else. Free tier covers a full run.
  # sendgrid — same idea.
  #
  # Both services need you to verify the address you send from first.
  provider: smtp
  from: john.doe@example.com

  # SMTP configuration (for Gmail, Outlook, etc.)
  smtp:
    host: smtp.gmail.com
    port: 465
    username: john.doe@gmail.com
    password: your-app-password  # Use app password, not your regular password!
    use_tls: true

  # Sending services, as alternatives to SMTP. Set provider above to match.
  # resend:
  #   api_key: re_xxxxxxxxxxxxxxxxxxxx
  # sendgrid:
  #   api_key: SG.xxxxxxxxxxxxxxxxxxxx

options:
  # Template to use: "gdpr", "ccpa", or "generic"
  template: generic

  # Delay between emails in milliseconds (avoid spam filters)
  rate_limit_ms: 2000

  # Only send to brokers in these regions (optional)
  # regions:
  #   - us
  #   - global

  # Skip these brokers (optional)
  # excluded_brokers:
  #   - spokeo
  #   - whitepages

pipeline:
  # Automation the tool may do on its own. Both default to off.
  # auto_confirm: false      # click confirmation links found in replies
  # auto_fill_forms: false   # drive a browser through opt-out forms
  # browser_headless: true
  # browser_timeout_sec: 30

  # Optional: a captcha solver you run yourself, tried before a challenge
  # is left for you to do by hand. eruser ships no solving models — you
  # point this at your own sidecar service, which answers
  #   POST {"kind": "hcaptcha", "page_url": "https://..."}
  #   -> 200 {"status": "solved"}   or {"status": "failed", "detail": "..."}
  # A solver that is unreachable, or claims success without the challenge
  # actually leaving the page, changes nothing: the form is left for you
  # exactly as it would be with no solver at all.
  captcha_solver:
    enabled: false
    # url: http://localhost:9100/solve
    # token: shared-secret    # optional, sent as a bearer token
    # timeout_sec: 30
    #
    # `url` above is the shorthand for one solver that is asked about every
    # kind of challenge. When different kinds need different sidecars — a
    # vision model for the picture grids, a token service for the invisible
    # ones — list them instead, in the order they should be tried. Each entry
    # may name a `kind` (hcaptcha, recaptcha_v2, cloudflare_turnstile, …),
    # and one that names none is asked about everything.
    #
    # Entries do not have to succeed alone: a solver that reports a failure,
    # or that cannot be reached, hands over to the next one. `url` and the
    # list are alternatives, not both — if you set both, the list is used.
    # solvers:
    #   - kind: hcaptcha
    #     url: http://localhost:9100/solve
    #     token: shared-secret
    #   - kind: image_captcha
    #     url: http://localhost:9101/solve
    #   - url: http://localhost:9102/solve   # asked about anything left over

  # Optional: replies to the brokers that ask for one. This is the master
  # switch — with it off, nothing is drafted and nothing is sent. Every
  # draft lands on the task list for you to read and send; nothing goes out
  # by itself unless its reply type is listed under auto_send, and
  # identity-verification requests are never auto-sent whatever the list
  # says.
  ai:
    enabled: false

    # Who writes the reply.
    #
    #   canned    — the reply eruser ships that fits best is used, with your
    #               own details filled in. Nothing is generated, so no model
    #               is needed anywhere. (The `decider:` section below can
    #               pick which one fits, if you have one.)
    #   generated — the model below writes the reply from scratch, under the
    #               rules in `reply::validate`.
    #
    # canned is the default the setup wizard offers; generated is what this
    # file shipped with before, so it stays the default here.
    wording: generated

    # The drafting model, when `wording: generated`. Speaks the
    # OpenAI-compatible chat API, so Ollama, llama.cpp server, LM Studio,
    # and vLLM all work as endpoints.
    # endpoint: http://localhost:11434/v1   # Ollama
    # model: qwen3:4b
    # api_key: ""                           # only if your sidecar wants one
    # timeout_sec: 60
    # max_drafts_per_run: 50
    # Reply types that may go out without a person pressing send.
    # Options: confirm, missing_info. Empty (the default) means every
    # draft waits for you.
    # auto_send: []

  # Optional: a decision model — Jev, from TypeSafe, or anything answering
  # the same contract, including a model you serve yourself. It writes
  # nothing. It picks one of the answers eruser offers it, which is what
  # makes it safe to point at a broker's email: the answer is a label from
  # eruser's own list, so there is nothing for an instruction hidden in the
  # email to hijack.
  #
  # The endpoint takes a host, a base URL, or the full path — the path is
  # completed for you:
  #   https://api.typesafe.ai    -> https://api.typesafe.ai/v1/systemone
  #   http://localhost:8000/v1   -> http://localhost:8000/v1/systemone
  #
  # Jev itself runs on TypeSafe's machines. Anything answering
  #   POST {"state": "...", "model": "...",
  #         "questions": {"decision": {"type": "choice", ...}}}
  # works by pointing this at it, so a model on your own machine is a
  # matter of serving that shape and setting the endpoint.
  decider:
    enabled: false
    # endpoint: https://api.typesafe.ai/v1/systemone
    # model: jev-latest
    # api_key: ""           # your TypeSafe key, if you use their endpoint
    # timeout_sec: 20
    # min_confidence: 0.6   # an answer below this is thrown away
    # route: false          # let it choose which reply an email deserves
    # classify: false       # let it file the replies the rules could not place
